      <stop offset="100%" stop-color="#20639b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" rx="12" fill="url(#bbg)"/>
  <circle cx="850" cy="120" r="140" fill="#4da6ff" opacity="0.12"/>
