<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="320" height="450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="60%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#20639b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="450" rx="10" fill="url(#bg1)"/>
  <!-- Book spine effect -->
  <rect x="0" y="0" width="22" height="450" rx="10" fill="#001830" opacity="0.6"/>
  <line x1="22" y1="0" x2="22" y2="450" stroke="#4da6ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Tag -->
  <rect x="42" y="36" width="90" height="24" rx="4" fill="#00A8FF"/>
  <text x="87" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEB DESIGN</text>
  <!-- Titles -->
  <text x="42" y="110" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Design Web</text>
  <text x="42" y="145" fill="#4da6ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Moderno</text>
  <text x="42" y="180" fill="#c2d9ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">HTML5, CSS3, UX/UI &amp; Acessibilidade</text>
  <!-- Icon graphic -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="120" height="85" rx="8" fill="#ffffff" opacity="0.08" stroke="#4da6ff" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#4da6ff" opacity="0.3"/>
    <circle cx="15" cy="11" r="3" fill="#ff5f56"/>
    <circle cx="26" cy="11" r="3" fill="#ffbd2e"/>
    <circle cx="37" cy="11" r="3" fill="#27c93f"/>
    <!-- Code brackets -->
    <path d="M40 45 L25 55 L40 65" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M80 45 L95 55 L80 65" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="65" y1="42" x2="55" y2="68" stroke="#4da6ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Badge footer -->
  <line x1="42" y1="365" x2="280" y2="365" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <text x="42" y="390" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Prof. Especialista</text>
  <text x="42" y="410" fill="#88bbee" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Edição Acadêmica UniFECAF</text>
</svg>